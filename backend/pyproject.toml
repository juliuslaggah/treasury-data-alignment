[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury-data-alignment-api"
version = "0.1.0"
description = "Professional treasury account data cleaning, validation and alignment API."
readme = { text = "Treasury data cleaning and account-alignment backend.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.116,<1.0",
    "pandas>=2.3,<3.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
    "rapidfuzz>=3.13,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "structlog>=25.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<7.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "pandas-stubs>=2.3,<3.0",
    "types-openpyxl>=3.1,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--cov=app",
    "--cov-report=term-missing",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true


